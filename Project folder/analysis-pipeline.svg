<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">The Analysis Pipeline — Ad Click to Growth Strategy</title>
  <desc id="pipeline-desc">A six-step workflow: collect, clean and calculate, analyze per platform, consolidate, diagnose, and communicate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="outcome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 48px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .subtitle{font:400 23px Inter,Segoe UI,Arial,sans-serif;fill:#aebbd0}
      .eyebrow{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#fbbf24;letter-spacing:2.2px}
      .stage{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#b8c4d8;letter-spacing:1.7px}
      .heading{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:-0.4px}
      .body{font:400 20px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .number{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#07111f;text-anchor:middle;dominant-baseline:middle}
      .out-label{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#fbbf24;letter-spacing:1.8px}
      .out-text{font:600 24px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .card{fill:#121e36;stroke:#2a3853;stroke-width:1.5}
      .flow{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}
      .icon{fill:none;stroke:#dbeafe;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1500" cy="88" r="180" fill="#7c3aed" opacity="0.06"/>
  <circle cx="95" cy="835" r="210" fill="#0ea5e9" opacity="0.05"/>

  <text class="eyebrow" x="80" y="66">E-COMMERCE DATA ANALYSIS</text>
  <text class="title" x="80" y="122">The Analysis Pipeline</text>
  <text class="subtitle" x="80" y="164">From disconnected platform exports to a focused, boardroom-ready growth strategy</text>
  <rect x="80" y="190" width="315" height="34" rx="17" fill="#f59e0b" opacity="0.14"/>
  <text x="103" y="213" class="stage" fill="#fbbf24">AD CLICK  →  GROWTH STRATEGY</text>

  <!-- Flow connectors -->
  <path class="flow" d="M470 350 H535"/>
  <path class="flow" d="M945 350 H1010"/>
  <path class="flow" d="M1225 455 V515"/>
  <path class="flow" d="M1030 635 H965"/>
  <path class="flow" d="M555 635 H490"/>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect class="card" x="80" y="245" width="390" height="210" rx="20"/>
    <rect x="80" y="245" width="390" height="6" rx="3" fill="#38bdf8"/>
    <circle cx="117" cy="286" r="20" fill="#38bdf8"/>
    <text class="number" x="117" y="287">1</text>
    <g class="icon" transform="translate(403 270)">
      <ellipse cx="18" cy="8" rx="15" ry="6"/>
      <path d="M3 8v22c0 3 7 6 15 6s15-3 15-6V8M3 19c0 3 7 6 15 6s15-3 15-6"/>
    </g>
    <text class="stage" x="150" y="292">COLLECT</text>
    <text class="heading" x="110" y="340">Raw exports</text>
    <text class="body" x="110" y="382">GA4 · Google Ads · Meta Ads</text>
    <text class="body" x="110" y="416">Shopify sales and checkout data</text>
  </g>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect class="card" x="555" y="245" width="390" height="210" rx="20"/>
    <rect x="555" y="245" width="390" height="6" rx="3" fill="#22d3ee"/>
    <circle cx="592" cy="286" r="20" fill="#22d3ee"/>
    <text class="number" x="592" y="287">2</text>
    <g class="icon" transform="translate(875 267)">
      <rect x="3" y="2" width="32" height="36" rx="4"/>
      <path d="M9 9h20M10 18h4M20 18h4M30 18h1M10 27h4M20 27h4M30 27h1"/>
    </g>
    <text class="stage" x="625" y="292">CLEAN &amp; CALCULATE</text>
    <text class="heading" x="585" y="340">Sheets and Excel</text>
    <text class="body" x="585" y="382">Filter · sort · standardize</text>
    <text class="body" x="585" y="416">Formulas · KPIs · charts</text>
  </g>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect class="card" x="1030" y="245" width="390" height="210" rx="20"/>
    <rect x="1030" y="245" width="390" height="6" rx="3" fill="#a78bfa"/>
    <circle cx="1067" cy="286" r="20" fill="#a78bfa"/>
    <text class="number" x="1067" y="287">3</text>
    <g class="icon" transform="translate(1371 269)">
      <path d="M3 36V19M14 36V9M25 36V24M36 36V3M1 36h38"/>
    </g>
    <text class="stage" x="1100" y="292">ANALYZE PER PLATFORM</text>
    <text class="heading" x="1060" y="340">Find each platform’s story</text>
    <text class="body" x="1060" y="382">Traffic · engagement · ad efficiency</text>
    <text class="body" x="1060" y="416">Checkout and product performance</text>
  </g>

  <!-- Stage 6 -->
  <g filter="url(#shadow)">
    <rect class="card" x="80" y="525" width="390" height="210" rx="20"/>
    <rect x="80" y="525" width="390" height="6" rx="3" fill="#fb7185"/>
    <circle cx="117" cy="566" r="20" fill="#fb7185"/>
    <text class="number" x="117" y="567">6</text>
    <g class="icon" transform="translate(400 550)">
      <path d="M4 18h7l18-10v28L11 26H4zM11 26l4 11h7l-5-8"/>
      <path d="M34 15c4 4 4 10 0 14"/>
    </g>
    <text class="stage" x="150" y="572">COMMUNICATE</text>
    <text class="heading" x="110" y="620">Present the strategy</text>
    <text class="body" x="110" y="662">Executive summary · recommendations</text>
    <text class="body" x="110" y="696">Prioritized roadmap and final deck</text>
  </g>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect class="card" x="555" y="525" width="390" height="210" rx="20"/>
    <rect x="555" y="525" width="390" height="6" rx="3" fill="#4ade80"/>
    <circle cx="592" cy="566" r="20" fill="#4ade80"/>
    <text class="number" x="592" y="567">5</text>
    <g class="icon" transform="translate(875 551)">
      <circle cx="16" cy="16" r="12"/>
      <path d="M25 25l11 11M11 16h10M16 11v10"/>
    </g>
    <text class="stage" x="625" y="572">DIAGNOSE</text>
    <text class="heading" x="585" y="620">Turn patterns into insight</text>
    <text class="body" x="585" y="662">Locate funnel leaks and data gaps</text>
    <text class="body" x="585" y="696">Prioritize channel and product actions</text>
  </g>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect class="card" x="1030" y="525" width="390" height="210" rx="20"/>
    <rect x="1030" y="525" width="390" height="6" rx="3" fill="#f59e0b"/>
    <circle cx="1067" cy="566" r="20" fill="#f59e0b"/>
    <text class="number" x="1067" y="567">4</text>
    <g class="icon" transform="translate(1348 550)">
      <rect x="3" y="3" width="13" height="13" rx="3"/>
      <rect x="24" y="3" width="13" height="13" rx="3"/>
      <rect x="3" y="24" width="13" height="13" rx="3"/>
      <rect x="24" y="24" width="13" height="13" rx="3"/>
    </g>
    <text class="stage" x="1100" y="572">CONSOLIDATE</text>
    <text class="heading" x="1060" y="620">Build one connected view</text>
    <text class="body" x="1060" y="662">Align four platforms with Claude AI</text>
    <text class="body" x="1060" y="696">Create a cross-platform dashboard</text>
  </g>

  <!-- Outcome -->
  <rect x="80" y="785" width="1340" height="72" rx="18" fill="url(#outcome)" stroke="#334155"/>
  <text class="out-label" x="112" y="815">BUSINESS OUTCOME</text>
  <text class="out-text" x="112" y="844">A defensible growth strategy that connects ad spend, customer behavior, and Shopify sales.</text>
  <path d="M1370 813l15 9-15 9" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
